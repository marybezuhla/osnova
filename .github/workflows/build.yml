name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

# Stale pull request runs are stopped. On main a run is never stopped once started; a newer push
# may replace one still waiting to start, and the newer version is then the one released
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests on a computer, in a job of their own: the test tools (Robolectric) fetch an Android runtime
  # that the dependency check cannot cover, so nothing they run can touch the APK built in "build".
  # No secrets, no write access.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar comes from upstream: check it is an official one before running it
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The texts in the app are rebuilt from the pinned sources (scripts/text/source) and must come out
      # exactly the same: anyone can check that nothing in them was changed by hand
      - name: Check the Constitution texts against their sources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -v 2>&1 | head -1
          python3 scripts/text/constitution_uk.py
          python3 scripts/text/constitution_en.py
          git diff --exit-code -- app/src/main/assets/

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          test -f gradle/verification-metadata.xml || { echo "gradle/verification-metadata.xml is missing" | tee test.log; exit 1; }
          ./gradlew --no-daemon testReleaseUnitTest 2>&1 | tee test.log

      - name: Prepare test log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "tests ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 test.log | head -300; echo ----; tail -150 test.log; } > log/test.log || true
          find app/build/test-results -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-log
          path: log/
          retention-days: 14

      # Pictures of the screens drawn by the tests with made-up data, for review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screens
          path: app/build/screens/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the unsigned APK, only after the tests passed. No secrets, no write access.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    # The release job checks the APK it signs against this; another job cannot change a job's output
    outputs:
      apk_sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: bash .github/check-version.sh "$EVENT" "$REF" "$REPO"

      # The prebuilt eSpeak NG library and the reading-aloud files: exactly the reviewed ones
      - name: Check the eSpeak library and voice files
        run: grep -v '^#' espeak/SHA256SUMS | sha256sum -c --quiet -

      - name: Check the Gradle version and checksum
        run: |
          P=gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14.3-bin.zip' "$P" || { echo "::error::$P must name the same Gradle as this workflow (8.14.3)"; exit 1; }
          WANT="$(curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          grep -q "^distributionSha256Sum=$WANT$" "$P" || { echo "::error::$P checksum differs from Gradle's: $WANT"; exit 1; }

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar comes from upstream: check it is an official one before running it.
      # The wrapper then checks Gradle itself against distributionSha256Sum.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # A release is built from scratch, without anything cached by earlier runs
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: ${{ github.event_name == 'push' }}

      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # Every library is checked against gradle/verification-metadata.xml (refreshed only by deps.yml);
          # the build fails on any changed library, and without the file.
          test -f gradle/verification-metadata.xml || { echo "gradle/verification-metadata.xml is missing" | tee build.log; exit 1; }
          ./gradlew --no-daemon lintRelease assembleRelease 2>&1 | tee build.log

      - name: Check permissions (only what is expected)
        run: bash .github/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Check the manifest (no backups, no plain HTTP, not debuggable, nothing open to other apps)
        run: bash .github/check-manifest.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Record the APK checksum
        id: sum
        shell: bash
        run: |
          # Taken first and checked, so a failed checksum stops here instead of passing on an empty value
          S="$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)"
          [[ "$S" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$S" >> "$GITHUB_OUTPUT"

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; cat permissions.txt 2>/dev/null; } > log/build.log || true
          cp app/build/reports/lint-results-release.txt log/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          path: log/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osnova-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      # To read crash traces from the shrunk (R8) build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osnova-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

  # Puts the screen pictures on the ci-screens branch, to look at them without downloading anything.
  # Runs no project code; only for this repository's own branches (never for pull requests from forks).
  screens:
    needs: test
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-screens
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: screens
          path: screens
      - name: Push the pictures
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -d screens ] && ls screens/*.png >/dev/null 2>&1 || { echo "No pictures"; exit 0; }
          mkdir push && cp screens/*.png push/ && cd push
          git init -q && git checkout -q -b ci-screens && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screens for ${SHA:0:7}"
          # A dropped connection: try again, and never fail a build over pictures
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}" ci-screens && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not push the pictures"

  # Signs. Only for main, only in the "release" environment (needs the owner's approval), and with
  # no Gradle or other third-party build code: just the Android SDK's own zipalign and apksigner.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          PASS: ${{ secrets.OSNOVA_SIGNING_PASS }}
          STORE: ${{ secrets.OSNOVA_STORE_PASS }}
          KEYSTORE: ${{ secrets.OSNOVA_KEYSTORE }}
        run: |
          if [ -n "$PASS" ] && [ -n "$STORE" ] && [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are not set in the release environment; nothing is published."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            signing
            version.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: osnova-unsigned
          path: unsigned

      - name: Check it is the APK the build made
        env:
          SUM: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          [[ "$SUM" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No APK checksum from the build"; exit 1; }
          echo "$SUM  unsigned/app-release-unsigned.apk" | sha256sum -c -

      # Checked again here, before signing, in a step that has no secrets
      - name: Check permissions and manifest again
        run: |
          bash .github/check-permissions.sh unsigned/app-release-unsigned.apk
          bash .github/check-manifest.sh unsigned/app-release-unsigned.apk

      - name: Sign
        env:
          PASS: ${{ secrets.OSNOVA_SIGNING_PASS }}
          STORE: ${{ secrets.OSNOVA_STORE_PASS }}
          KEYSTORE: ${{ secrets.OSNOVA_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The encrypted keystore lives only in the release environment's secrets, not in the repository.
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/k.enc"
          printf %s "$PASS" > "$RUNNER_TEMP/p"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/k.enc" -out "$RUNNER_TEMP/osnova.jks" -pass file:"$RUNNER_TEMP/p"
          rm "$RUNNER_TEMP/p" "$RUNNER_TEMP/k.enc"
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="out/osnova-$(tr -d '[:space:]' < version.txt).apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/osnova.jks" --ks-key-alias osnova \
            --ks-pass env:STORE --key-pass env:STORE --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/osnova.jks"
          # Exactly one signer, and it must be exactly Osnova's own (signing/certificate-sha256.txt)
          CERT="$(tr -d '[:space:]' < signing/certificate-sha256.txt)"
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Bad signing/certificate-sha256.txt"; exit 1; }
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          # Older apksigner prints "Signer #1 certificate ...", newer "V3.0 Signer: certificate ...".
          # Each signing scheme may repeat the same certificate; any second, different one fails.
          DIGESTS="$({ grep -iE "Signer[^:]*:? *certificate SHA-256 digest:" certs.txt || true; } | sed -E 's/.*digest: *//' | tr -d ' ' | tr 'A-F' 'a-f' | sort -u)"
          if [ "$DIGESTS" != "$CERT" ]; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/osnova.jks" "$RUNNER_TEMP/p" "$RUNNER_TEMP/k.enc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osnova-signed
          path: out/*.apk
          retention-days: 7

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/release-notes.md
            .github/check-version.sh
            version.txt
            fastlane/metadata/android/uk/changelogs
            fastlane/metadata/android/en-US/changelogs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: osnova-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Checked again right before publishing: two approved runs must not publish out of order
          bash .github/check-version.sh push refs/heads/main "$REPO"
          V="$(tr -d '[:space:]' < version.txt)"
          # The SHA-256 of the APK, so anyone can check the file they downloaded is this one
          cp .github/release-notes.md notes.md
          # Taken first and checked: the notes never go out without the file's SHA-256
          SUMS="$(cd out && sha256sum *.apk)"
          [[ "$SUMS" =~ ^[0-9a-f]{64}\ \ [^/]+\.apk$ ]]
          printf '\nSHA-256:\n```\n%s\n```\n' "$SUMS" >> notes.md
          gh release create "v$V" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Osnova $V" --notes-file notes.md --latest
